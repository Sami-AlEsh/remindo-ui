<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Remindo mark: the lucide bell-ring glyph used in the app header, on a
    Warm Botanical sage tile. Path data copied verbatim from lucide-react
    1.29.0 so the favicon and the header icon are the same drawing.

    Colours are set as presentation attributes first and overridden by the
    <style> block, so browsers that ignore CSS in favicons (Safari) still get
    the light-mode tile rather than an unresolved var falling back to black.
  -->
  <style>
    @media (prefers-color-scheme: dark) {
      .tile { fill: #63ab74; }
      .bell { stroke: #0c140d; }
    }
  </style>

  <rect class="tile" width="32" height="32" rx="7.5" fill="#185b37" />

  <g
    class="bell"
    transform="translate(4 4)"
    fill="none"
    stroke="#fafbf5"
    stroke-width="2.25"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M10.268 21a2 2 0 0 0 3.464 0" />
    <path d="M22 8c0-2.3-.8-4.3-2-6" />
    <path
      d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"
    />
    <path d="M4 2C2.8 3.7 2 5.7 2 8" />
  </g>
</svg>
